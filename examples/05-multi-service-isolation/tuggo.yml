# 05: Multi-service local stack with explicit networks, health checks and volumes.
dev:
  services:
    gateway:
      image: nginx:alpine
      ports:
        - "8090:80"
      networks: [frontend]
    db:
      image: postgres:16-alpine
      environment:
        POSTGRES_USER: app
        POSTGRES_PASSWORD: dev-only-password
        POSTGRES_DB: app
      volumes:
        - database:/var/lib/postgresql/data
      networks: [backend]
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U app -d app"]
        interval: 5s
        timeout: 3s
        retries: 10
    admin:
      image: adminer:4
      ports:
        - "8091:8080"
      networks: [backend]
      depends_on:
        db:
          condition: service_healthy
    cache:
      image: redis:7-alpine
      networks: [backend]
      volumes:
        - cache_data:/data
      command: ["redis-server", "--appendonly", "yes"]
  networks:
    frontend:
    backend:
  volumes:
    database:
    cache_data:
test:
  services:
    gateway:
      image: nginx:alpine
      ports:
        - "8092:80"
      networks: [frontend]
    db:
      image: postgres:16-alpine
      environment:
        POSTGRES_USER: app
        POSTGRES_PASSWORD: test-only-password
        POSTGRES_DB: app
      tmpfs: [/var/lib/postgresql/data]
      networks: [backend]
    admin:
      image: adminer:4
      ports:
        - "8093:8080"
      networks: [backend]
      depends_on: [db]
    cache:
      image: redis:7-alpine
      networks: [backend]
  networks:
    frontend:
    backend:
